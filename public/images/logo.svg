<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shield Icon with Heart/Play -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield -->
    <path d="M26 2 L48 10 L48 30 C48 44 26 54 26 54 C26 54 4 44 4 30 L4 10 Z" fill="#12121e" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Inner Heart Shape -->
    <path d="M26 18 C20 12 12 18 15 25 C18 32 26 40 26 40 C26 40 34 32 37 25 C40 18 32 12 26 18 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5"/>
    <!-- Play Triangle -->
    <polygon points="23,23 31,28 23,33" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <!-- Arabic Name -->
  <text x="72" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="0.5">وقاية</text>
  
  <!-- PRO Badge Pill -->
  <rect x="135" y="16" width="58" height="24" rx="12" fill="url(#pillGrad)" filter="url(#glow)"/>
  <text x="145" y="33" font-family="'Outfit', 'Inter', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">PRO</text>

  <!-- Subtitle Tagline -->
  <text x="73" y="52" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="2">WEQAYA PRO • +18</text>
</svg>
