<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Categories & Genres Hub — Wi9ayah Pro</title>
  <meta name="description" content="Explore curated video categories, niches, and genres in high definition on Wi9ayah Pro.">
  <link rel="icon" type="image/png" href="/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/design-system.css?v=2.0">
  <link rel="stylesheet" href="/css/style.css?v=2.0">

  <!-- Monetization Scripts -->
  <script src="https://pl31054762.profitableratecpmnetwork.com/72/f4/9a/72f49a7889c2432c21f5fdf844a52e5d.js"></script>
</head>
<body>

  <div class="site-wrapper">
    <!-- Top Sticky Navigation Bar -->
    <header class="primary-nav">
      <div class="nav-container">
        <a href="/" class="brand-link">
          <div class="brand-p-badge">W</div>
          <span class="brand-text">Wi9ayah<span style="color: var(--color-ink);">.pro</span></span>
        </a>

        <div class="nav-search-wrapper">
          <i class="fa fa-search search-bar-icon"></i>
          <input type="text" id="categorySearchInput" class="search-bar" placeholder="Search category (e.g. Amateur, MILF, 4K)..." oninput="filterCategories(this.value)">
        </div>

        <div class="nav-actions-cluster desktop-only">
          <a href="/" class="nav-link-item">
            <i class="fa fa-compass"></i> Explore
          </a>
          <a href="/models.html" class="nav-link-item">
            <i class="fa fa-crown" style="color: #ffd700;"></i> Stars
          </a>
          <a href="/categories.html" class="nav-link-item active">
            <i class="fa fa-th-large"></i> Categories
          </a>
          <a href="/health.html" class="nav-link-item highlight-link">
            <i class="fa fa-shield-heart" style="color: #103c25;"></i> Health Guide
          </a>
          <a href="/favorites.html" class="btn-primary">
            <i class="fa fa-bookmark"></i> Saved Pins
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="masonry-container">

        <section class="performers-header">
          <span class="pin-overlay-pill" style="position: static; display: inline-block; margin-bottom: 12px; background: var(--color-surface-card);">
            🗂️ 50+ Curated Genres
          </span>
          <h1 class="display-lg" style="margin-bottom: 8px;">Explore All Categories</h1>
          <p class="body-md" style="color: var(--color-mute); max-width: 600px; margin: 0 auto;">
            Browse through our expansive collection of curated video boards, 4K productions, and niche themes.
          </p>
        </section>

        <!-- Category Tiles Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: var(--spacing-xxl);" id="categoriesGrid"></div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="footer-section">
      <div class="footer-container">
        <div class="footer-bottom-row" style="border: none; padding-top: 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="brand-p-badge" style="width: 24px; height: 24px; font-size: 12px;">W</div>
            <span style="font-weight: 700; color: var(--color-ink);">Wi9ayah Pro © 2026.</span>
          </div>
          <div>
            <a href="/" class="link-inline" style="margin-right: 16px;">Home</a>
            <a href="/health.html" class="link-inline" style="margin-right: 16px;">Health & Safety</a>
            <a href="/dmca.html" class="link-inline">DMCA</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-bar">
      <a href="/" class="mobile-tab-btn">
        <i class="fa fa-compass"></i>
        <span>Explore</span>
      </a>
      <a href="/reels.html" class="mobile-tab-btn">
        <i class="fa fa-clapperboard"></i>
        <span>Reels</span>
      </a>
      <a href="/models.html" class="mobile-tab-btn">
        <i class="fa fa-crown"></i>
        <span>Stars</span>
      </a>
      <a href="/categories.html" class="mobile-tab-btn active">
        <i class="fa fa-th-large"></i>
        <span>Categories</span>
      </a>
      <a href="/favorites.html" class="mobile-tab-btn">
        <i class="fa fa-bookmark"></i>
        <span>Saved</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="/js/categories.js?v=2.0"></script>
</body>
</html>
