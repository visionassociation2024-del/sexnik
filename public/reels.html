<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Reels (+18 Shorts & Vertical Video Feed) — Wi9ayah Pro</title>
  <meta name="description" content="Watch addictive short video reels, vertical stories, and viral shorts on Wi9ayah Pro.">
  <link rel="icon" type="image/png" href="/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/design-system.css?v=2.0">
  <link rel="stylesheet" href="/css/style.css?v=2.0">

  <!-- Monetization Scripts -->
  <script src="https://pl31054762.profitableratecpmnetwork.com/72/f4/9a/72f49a7889c2432c21f5fdf844a52e5d.js"></script>
</head>
<body style="background-color: var(--color-surface-dark); color: #ffffff; height: 100vh; overflow: hidden;">

  <div class="site-wrapper" style="height: 100vh;">
    <!-- Top Sticky Navigation Bar -->
    <header class="primary-nav" style="border-color: rgba(255,255,255,0.1);">
      <div class="nav-container">
        <a href="/" class="brand-link">
          <div class="brand-p-badge">W</div>
          <span class="brand-text">Wi9ayah<span style="color: var(--color-ink);">.pro</span></span>
        </a>

        <div class="nav-actions-cluster" style="margin-left: auto;">
          <a href="/" class="btn-secondary" style="border-radius: var(--radius-full);">
            <i class="fa fa-arrow-left"></i> Exit Reels
          </a>
          <a href="/models.html" class="nav-link-item desktop-only">
            <i class="fa fa-crown" style="color: #ffd700;"></i> Stars
          </a>
          <a href="/favorites.html" class="btn-primary">
            <i class="fa fa-bookmark"></i> Saved Pins
          </a>
        </div>
      </div>
    </header>

    <!-- Vertical Video Stage -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
      
      <!-- Center Phone Stage Container -->
      <div style="width: 100%; max-width: 440px; height: calc(100vh - 128px); position: relative; border-radius: var(--radius-lg); overflow: hidden; background: #000000; box-shadow: 0 16px 40px rgba(0,0,0,0.6);" id="reelStageContainer">
        
        <!-- Video Iframe / Player -->
        <iframe id="reelPlayerIframe" src="https://www.eporner.com/embed/sample/" style="width: 100%; height: 100%; border: none; display: block;" allow="autoplay; fullscreen; encrypted-media"></iframe>

        <!-- Overlay Details & Actions -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 20px; background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%); pointer-events: none;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
            <img src="/images/logo.png" style="width: 36px; height: 36px; border-radius: 9999px; object-fit: cover;" alt="Creator">
            <span style="font-weight: 700; font-size: 15px; color: #ffffff;" id="reelCreatorName">@wi9ayah_stars</span>
          </div>
          <p style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.9); line-height: 1.4; margin-bottom: 6px;" id="reelTitle">
            Exclusive Viral Reel Video Stream
          </p>
          <span class="pin-overlay-pill" style="position: static; display: inline-block; background: rgba(255,255,255,0.2); color: #ffffff; backdrop-filter: blur(4px);">
            #Reels #Shorts #HD
          </span>
        </div>

        <!-- Floating Right Action Column -->
        <div style="position: absolute; right: 16px; bottom: 90px; display: flex; flex-direction: column; gap: 14px; z-index: 10;">
          <button class="btn-icon-circular js-save-pin" style="background: rgba(255,255,255,0.9); color: #e60023; width: 44px; height: 44px;" title="Save Pin" onclick="saveActiveReel()">
            <i class="fa fa-bookmark"></i>
          </button>
          <button class="btn-icon-circular" style="background: rgba(255,255,255,0.9); width: 44px; height: 44px;" title="Like" onclick="this.style.color='#e60023'">
            <i class="fa fa-heart"></i>
          </button>
          <button class="btn-icon-circular" style="background: rgba(255,255,255,0.9); width: 44px; height: 44px;" title="Share" onclick="shareReel()">
            <i class="fa fa-share"></i>
          </button>
          <button class="btn-icon-circular" style="background: #e60023; color: #ffffff; width: 44px; height: 44px;" title="Next Reel" onclick="nextReel()">
            <i class="fa fa-arrow-down"></i>
          </button>
        </div>

      </div>

    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-bar">
      <a href="/" class="mobile-tab-btn">
        <i class="fa fa-compass"></i>
        <span>Explore</span>
      </a>
      <a href="/reels.html" class="mobile-tab-btn active">
        <i class="fa fa-clapperboard"></i>
        <span>Reels</span>
      </a>
      <a href="/models.html" class="mobile-tab-btn">
        <i class="fa fa-crown"></i>
        <span>Stars</span>
      </a>
      <a href="/health.html" class="mobile-tab-btn">
        <i class="fa fa-shield-heart"></i>
        <span>Health</span>
      </a>
      <a href="/favorites.html" class="mobile-tab-btn">
        <i class="fa fa-bookmark"></i>
        <span>Saved</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="/js/masonry.js?v=2.0"></script>
  <script>
    let reelVideos = [];
    let activeReelIdx = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/videos?category=tiktok&page=1');
        const data = await res.json();
        reelVideos = data.videos || [];
        if (reelVideos.length === 0) {
          const fallback = await fetch('/api/videos?category=trending&page=1');
          const fbData = await fallback.json();
          reelVideos = fbData.videos || [];
        }
        if (reelVideos.length > 0) {
          displayReel(0);
        }
      } catch (e) {
        console.warn('[Reel Load Error]', e);
      }
    });

    function displayReel(idx) {
      if (!reelVideos[idx]) return;
      activeReelIdx = idx;
      const v = reelVideos[idx];

      const iframe = document.getElementById('reelPlayerIframe');
      const title = document.getElementById('reelTitle');
      const creator = document.getElementById('reelCreatorName');

      let embed = v.embed_url || v.video_url || `https://www.eporner.com/embed/${v.id}/`;
      if (iframe) iframe.src = embed;
      if (title) title.textContent = v.title || 'Exclusive Short Reel';
      if (creator) creator.textContent = `@${(v.author || 'wi9ayah_creator').replace(/\s+/g, '_').toLowerCase()}`;
    }

    function nextReel() {
      if (activeReelIdx < reelVideos.length - 1) {
        displayReel(activeReelIdx + 1);
      } else {
        displayReel(0);
      }
    }

    function shareReel() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          if (window.pinEngine) window.pinEngine.showToast('Reel link copied! 📋', 'success');
        });
      }
    }

    function saveActiveReel() {
      if (reelVideos[activeReelIdx] && window.pinEngine) {
        window.pinEngine.toggleSavePin(reelVideos[activeReelIdx]);
      }
    }

    // Keyboard navigation (ArrowDown / ArrowUp)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') nextReel();
      if (e.key === 'ArrowUp' && activeReelIdx > 0) displayReel(activeReelIdx - 1);
    });
  </script>
</body>
</html>
