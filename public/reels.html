  <script>
    let reelsData = [];
    let currentReelIndex = 0;

    document.addEventListener('DOMContentLoaded', () => {
      loadReelsFeed();
    });

    async function loadReelsFeed() {
      const container = document.getElementById('reelsFeedScroll');
      try {
        const res = await fetch('/api/tiktok?q=trending&page=1');
        const data = await res.json();
        reelsData = (data.success && data.videos && data.videos.length > 0) ? data.videos : [];

        if (reelsData.length === 0) {
          container.innerHTML = '<div style="height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">No reels available.</div>';
          return;
        }

        container.innerHTML = '';
        reelsData.forEach((r, idx) => {
          const slide = document.createElement('div');
          slide.className = 'reel-slide';
          slide.dataset.index = idx;

          const videoUrl = r.direct_video_url || r.video_url || r.embed_url;
          const thumb = r.poster || r.thumbnail || '/images/logo.png';
          const title = r.title || 'Weqaya 18+ Reel';

          slide.innerHTML = `
            <img src="${thumb}" class="reel-blur-bg" alt="blur">
            <video class="reel-video" src="${videoUrl}" playsinline loop preload="${idx === 0 ? 'auto' : 'none'}" poster="${thumb}" onclick="toggleReelPlay(this)"></video>
            
            <div class="reel-actions-rail">
              <button class="btn-reel-action" onclick="likeReel(this)"><i class="fa fa-heart"></i></button>
              <button class="btn-reel-action" onclick="shareReel()"><i class="fa fa-share-alt"></i></button>
              <a href="/watch.html?id=${r.id}" class="btn-reel-action" title="Full Stream"><i class="fa fa-expand"></i></a>
            </div>

            <div class="reel-bottom-info">
              <div class="reel-author-badge"><i class="fa fa-check-circle"></i> Verified Master</div>
              <div class="reel-title">${title}</div>
            </div>
          `;
          container.appendChild(slide);
        });

        initScrollObserver();
      } catch (err) {
        container.innerHTML = '<div style="height: 100%; display: flex; align-items: center; justify-content: center; color: #ef4444;">Failed to load reels.</div>';
      }
    }

    function initScrollObserver() {
      const slides = document.querySelectorAll('.reel-slide');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (entry.isIntersecting) {
            if (video) {
              video.play().catch(() => {});
            }
          } else {
            if (video) {
              video.pause();
              video.currentTime = 0;
            }
          }
        });
      }, { threshold: 0.6 });

      slides.forEach(s => observer.observe(s));
    }

    function toggleReelPlay(video) {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function likeReel(btn) {
      btn.style.background = '#ff007f';
      btn.style.color = '#fff';
    }

    function shareReel() {
      if (navigator.share) {
        navigator.share({ title: 'Weqaya Reels', url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Reel link copied to clipboard!');
      }
    }
  </script>
