<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Saved Pins & Collections — Wi9ayah Pro</title>
  <meta name="description" content="Manage your saved video pins, favorite performers, and bookmarked collections on Wi9ayah Pro.">
  <link rel="icon" type="image/png" href="/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/design-system.css?v=2.0">
  <link rel="stylesheet" href="/css/style.css?v=2.0">

  <!-- Monetization Scripts -->
  <script src="https://pl31054762.profitableratecpmnetwork.com/72/f4/9a/72f49a7889c2432c21f5fdf844a52e5d.js"></script>
</head>
<body>

  <div class="site-wrapper">
    <!-- Top Sticky Navigation Bar -->
    <header class="primary-nav">
      <div class="nav-container">
        <a href="/" class="brand-link">
          <div class="brand-p-badge">W</div>
          <span class="brand-text">Wi9ayah<span style="color: var(--color-ink);">.pro</span></span>
        </a>

        <div class="nav-search-wrapper">
          <i class="fa fa-search search-bar-icon"></i>
          <input type="text" class="search-bar" placeholder="Search your saved pins..." oninput="filterSavedPins(this.value)">
        </div>

        <div class="nav-actions-cluster desktop-only">
          <a href="/" class="nav-link-item">
            <i class="fa fa-compass"></i> Explore
          </a>
          <a href="/models.html" class="nav-link-item">
            <i class="fa fa-crown" style="color: #ffd700;"></i> Stars
          </a>
          <a href="/history.html" class="nav-link-item">
            <i class="fa fa-history"></i> History
          </a>
          <a href="/favorites.html" class="btn-primary">
            <i class="fa fa-bookmark"></i> Saved Pins
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" style="padding-top: var(--spacing-xl);">
      <div class="masonry-container">

        <section class="performers-header">
          <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px;">
            <div class="brand-p-badge" style="width: 44px; height: 44px; font-size: 20px;">
              <i class="fa fa-bookmark"></i>
            </div>
          </div>
          <h1 class="display-lg">My Saved Pins Board</h1>
          <p class="body-md" style="color: var(--color-mute); max-width: 500px; margin: 0 auto 16px;">
            All your saved videos and bookmarked inspirations are safely stored locally in your browser.
          </p>

          <div style="display: flex; justify-content: center; gap: 10px;">
            <button class="btn-secondary" onclick="clearAllSavedPins()"><i class="fa fa-trash"></i> Clear All Saved Pins</button>
            <a href="/" class="btn-primary"><i class="fa fa-compass"></i> Discover More Pins</a>
          </div>
        </section>

        <!-- Saved Pins Masonry Grid -->
        <div class="pin-masonry-grid" id="savedPinsGrid"></div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="footer-section">
      <div class="footer-container">
        <div class="footer-bottom-row" style="border: none; padding-top: 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="brand-p-badge" style="width: 24px; height: 24px; font-size: 12px;">W</div>
            <span style="font-weight: 700; color: var(--color-ink);">Wi9ayah Pro © 2026.</span>
          </div>
          <div>
            <a href="/" class="link-inline" style="margin-right: 16px;">Home</a>
            <a href="/health.html" class="link-inline" style="margin-right: 16px;">Health & Safety</a>
            <a href="/dmca.html" class="link-inline">DMCA</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-bar">
      <a href="/" class="mobile-tab-btn">
        <i class="fa fa-compass"></i>
        <span>Explore</span>
      </a>
      <a href="/reels.html" class="mobile-tab-btn">
        <i class="fa fa-clapperboard"></i>
        <span>Reels</span>
      </a>
      <a href="/models.html" class="mobile-tab-btn">
        <i class="fa fa-crown"></i>
        <span>Stars</span>
      </a>
      <a href="/health.html" class="mobile-tab-btn">
        <i class="fa fa-shield-heart"></i>
        <span>Health</span>
      </a>
      <a href="/favorites.html" class="mobile-tab-btn active">
        <i class="fa fa-bookmark"></i>
        <span>Saved</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="/js/masonry.js?v=2.0"></script>
  <script>
    let savedList = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedBoard();
    });

    function loadSavedBoard() {
      if (!window.pinEngine) return;
      savedList = window.pinEngine.getSavedPins();
      renderSavedGrid(savedList);
    }

    function renderSavedGrid(list) {
      const grid = document.getElementById('savedPinsGrid');
      if (!grid) return;

      if (list.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 64px 20px; background: #ffffff; border-radius: 16px; margin-top: 20px;">
            <i class="fa fa-bookmark" style="font-size: 42px; color: #91918c; margin-bottom: 16px;"></i>
            <h3 style="font-size: 20px; font-weight: 700; color: #000000; margin-bottom: 8px;">No Saved Pins Yet</h3>
            <p style="color: #62625b; font-size: 15px; margin-bottom: 20px;">When you see videos you love, click the red "Save" button to keep them on this board.</p>
            <a href="/" class="btn-primary">Explore Trending Pins</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(p => `
        <div class="pin-card" data-id="${p.id}" data-title="${escapeHtml(p.title)}" data-thumb="${p.thumbnail}" data-duration="${p.duration}">
          <div class="pin-media-wrapper" onclick="window.location.href='/watch.html?id=${p.id}'">
            <img src="${p.thumbnail}" alt="${escapeHtml(p.title)}" class="pin-image" loading="lazy">
            <div class="pin-overlay-scrim"></div>
            <button class="pin-save-cta js-save-pin" data-id="${p.id}" style="background-color: #262622;" title="Remove Pin">Saved</button>
            <span class="pin-overlay-pill pin-pill-duration">${p.duration || 'HD'}</span>
          </div>
          <div class="pin-meta" onclick="window.location.href='/watch.html?id=${p.id}'">
            <h3 class="pin-title">${escapeHtml(p.title)}</h3>
            <div class="pin-author">
              <span class="pin-author-name">${p.author || 'Saved Pin'}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterSavedPins(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderSavedGrid(savedList);
        return;
      }
      const filtered = savedList.filter(p => p.title && p.title.toLowerCase().includes(q));
      renderSavedGrid(filtered);
    }

    function clearAllSavedPins() {
      if (confirm('Are you sure you want to clear your saved pins board?')) {
        localStorage.removeItem('pinterest_saved_pins');
        loadSavedBoard();
        if (window.pinEngine) window.pinEngine.showToast('Saved pins board cleared', 'info');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
