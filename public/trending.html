  <script>
    let trendingPage = 1;
    let isTrendingLoading = false;
    let hasMoreTrending = true;
    let renderedTrendingIds = new Set();
    let trendingObserver = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadTrendingBatch(true);
      initTrendingInfiniteScroll();
    });

    async function loadTrendingBatch(isInitial = false) {
      if (isTrendingLoading || (!hasMoreTrending && !isInitial)) return;
      isTrendingLoading = true;

      const grid = document.getElementById('trendingVideosGrid');
      const loader = document.getElementById('trendingLoader');
      const countLabel = document.getElementById('trendingCountLabel');

      if (isInitial) {
        trendingPage = 1;
        hasMoreTrending = true;
        renderedTrendingIds.clear();
        grid.innerHTML = getSkeleton(8);
      } else if (loader) {
        loader.style.display = 'flex';
      }

      try {
        const res = await fetch(`/api/videos?category=trending&page=${trendingPage}`);
        const data = await res.json();
        const videos = (data.success && data.videos && data.videos.length > 0) ? data.videos : [];

        if (isInitial) grid.innerHTML = '';

        if (videos.length > 0) {
          const unique = videos.filter(v => !renderedTrendingIds.has(v.id));
          if (unique.length > 0) {
            unique.forEach(v => {
              renderedTrendingIds.add(v.id);
              grid.appendChild(createVideoCard(v));
            });
            trendingPage++;
            if (countLabel) countLabel.innerText = `${renderedTrendingIds.size}+ Trending Videos`;
          } else if (trendingPage > 1) {
            trendingPage++;
          }
        } else {
          hasMoreTrending = false;
        }
      } catch (e) {
        if (isInitial) grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 50px;">Failed to load trending videos.</div>';
      } finally {
        isTrendingLoading = false;
        if (loader) loader.style.display = 'none';
      }
    }

    function createVideoCard(v) {
      const card = document.createElement('div');
      card.className = 'video-card animate-fade';
      card.onclick = () => {
        const params = new URLSearchParams({
          id: v.id || '',
          title: v.title || '',
          embed: v.embed_url || v.video_url || '',
          thumb: v.thumbnail || '',
          duration: v.duration || '12:00',
          views: v.views || '18K',
          rating: v.rating || '98%',
          tags: (v.tags || ['trending', 'niksex']).join(',')
        });
        window.location.href = `/watch.html?${params.toString()}`;
      };

      card.innerHTML = `
        <div class="thumb-wrap">
          <img src="${v.thumbnail || '/images/logo.png'}" alt="${v.title}" loading="lazy" onerror="this.src='/images/logo.png'">
          <span class="badge-hd">1080p HD</span>
          <span class="badge-duration">${v.duration || '12:00'}</span>
        </div>
        <div class="card-details">
          <h3 class="video-title" title="${v.title}">${v.title}</h3>
          <div class="video-meta">
            <span><i class="fa fa-eye"></i> ${v.views || '15K'}</span>
            <span class="meta-rating"><i class="fa fa-thumbs-up"></i> ${v.rating || '98%'}</span>
          </div>
        </div>
      `;
      return card;
    }

    function initTrendingInfiniteScroll() {
      const sentinel = document.getElementById('trendingSentinel');
      if (!sentinel) return;
      trendingObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isTrendingLoading && hasMoreTrending) {
          loadTrendingBatch(false);
        }
      }, { rootMargin: '400px' });
      trendingObserver.observe(sentinel);
    }

    function handleTrendingSearch(e) {
      if (e.key === 'Enter') executeTrendingSearch();
    }
    function executeTrendingSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) window.location.href = `/?q=${encodeURIComponent(q)}`;
    }

    function getSkeleton(count = 8) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `
          <div class="video-card" style="opacity: 0.5;">
            <div class="thumb-wrap" style="background: #1e1e2d;"></div>
            <div class="card-details"><div style="height: 14px; background: #28283c; border-radius: 4px; margin-bottom: 8px;"></div></div>
          </div>
        `;
      }
      return html;
    }
  </script>
