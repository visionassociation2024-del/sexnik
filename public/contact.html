<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Contact & Inquiries — Wi9ayah Pro</title>
  <meta name="description" content="Contact the Wi9ayah Pro team for support, business inquiries, and DMCA questions.">
  <link rel="icon" type="image/png" href="/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/design-system.css?v=2.0">
  <link rel="stylesheet" href="/css/style.css?v=2.0">
</head>
<body>

  <div class="site-wrapper">
    <!-- Top Sticky Navigation Bar -->
    <header class="primary-nav">
      <div class="nav-container">
        <a href="/" class="brand-link">
          <div class="brand-p-badge">W</div>
          <span class="brand-text">Wi9ayah<span style="color: var(--color-ink);">.pro</span></span>
        </a>

        <div class="nav-actions-cluster" style="margin-left: auto;">
          <a href="/" class="btn-secondary">
            <i class="fa fa-arrow-left"></i> Back to Explore
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" style="padding-top: var(--spacing-xxl);">
      <div class="masonry-container" style="max-width: 700px;">

        <div class="feature-card" style="border: 1px solid var(--color-hairline);">
          <span class="pin-overlay-pill" style="position: static; display: inline-block; background: var(--color-surface-card); margin-bottom: 12px;">
            ✉️ Contact Support
          </span>
          <h1 class="display-lg" style="font-size: 32px; margin-bottom: 8px;">Get in Touch</h1>
          <p class="body-md" style="color: var(--color-mute); margin-bottom: 24px;">
            Have questions, feedback, or business inquiries? Send our support team a direct message below.
          </p>

          <form onsubmit="handleContactSubmit(event)" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
              <label class="body-strong" style="display: block; margin-bottom: 6px; font-size: 14px;">Your Name</label>
              <input type="text" class="text-input" placeholder="Enter your name" required>
            </div>

            <div>
              <label class="body-strong" style="display: block; margin-bottom: 6px; font-size: 14px;">Email Address</label>
              <input type="email" class="text-input" placeholder="name@example.com" required>
            </div>

            <div>
              <label class="body-strong" style="display: block; margin-bottom: 6px; font-size: 14px;">Subject</label>
              <select class="text-input" style="background: var(--color-canvas);">
                <option>General Feedback</option>
                <option>Sexual Wellness & Guide Inquiries</option>
                <option>Technical Bug / Broken Link</option>
                <option>DMCA / Copyright Question</option>
                <option>Business Partnership</option>
              </select>
            </div>

            <div>
              <label class="body-strong" style="display: block; margin-bottom: 6px; font-size: 14px;">Message</label>
              <textarea class="text-input" style="height: 120px; padding: 12px; resize: vertical;" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" class="btn-primary" style="height: 48px; font-size: 15px; margin-top: 8px;">
              <i class="fa fa-paper-plane"></i> Send Message
            </button>
          </form>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="footer-section">
      <div class="footer-container">
        <div class="footer-bottom-row" style="border: none; padding-top: 0;">
          <span style="font-weight: 700; color: var(--color-ink);">Wi9ayah Pro © 2026.</span>
          <div>
            <a href="/" class="link-inline" style="margin-right: 16px;">Home</a>
            <a href="/health.html" class="link-inline" style="margin-right: 16px;">Health Guide</a>
            <a href="/privacy.html" class="link-inline">Privacy Policy</a>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      alert('Thank you for your message! Our support team will respond within 24-48 hours.');
      e.target.reset();
    }
  </script>
</body>
</html>
