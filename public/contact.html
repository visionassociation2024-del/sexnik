<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us & Removal Inquiries - وقاية برو (Weqaya Pro)</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=2.8">

  <!-- Monetization & Popunder Scripts -->
  <script src="https://pl31054762.profitableratecpmnetwork.com/72/f4/9a/72f49a7889c2432c21f5fdf844a52e5d.js"></script>
  <script src="https://pl31054764.profitableratecpmnetwork.com/16/4d/5c/164d5cb44941d85d54f598046baf38b5.js"></script>

  <style>
    .static-page-container {
      max-width: 800px;
      margin: 30px auto 80px;
      padding: 0 20px;
    }
    .static-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 36px 30px;
      line-height: 1.8;
      color: #cbd5e1;
    }
    .static-card h1 { font-size: 26px; color: #fff; margin-bottom: 8px; font-weight: 800; }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .form-control:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }
  </style>
  <script src="/js/weqaya_guard.js?v=1.0"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <img src="/images/logo.png" alt="وقاية برو Logo">
      </a>
      <div class="nav-actions">
        <a href="/" class="btn-pill"><i class="fa fa-arrow-left"></i> Return to Videos</a>
      </div>
    </div>
  </header>

  <div class="static-page-container">
    <div class="static-card">
      <h1>Contact Us & Support</h1>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
        For general inquiries, webmaster communication, or content delisting requests, please use the form below.
      </p>

      <form onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label>Your Name / Organization</label>
          <input type="text" class="form-control" placeholder="Enter your name or rights holder entity" required>
        </div>

        <div class="form-group">
          <label>Your Email Address</label>
          <input type="email" class="form-control" placeholder="e.g. contact@domain.com" required>
        </div>

        <div class="form-group">
          <label>Inquiry Subject</label>
          <select class="form-control" style="background: #161622; color: #fff;">
            <option>Content Delisting / DMCA Takedown</option>
            <option>Advertising & Partnership</option>
            <option>Technical Issue / Broken Embed</option>
            <option>General Feedback</option>
          </select>
        </div>

        <div class="form-group">
          <label>Message & Relevant Video URLs</label>
          <textarea class="form-control" placeholder="Describe your request in detail. If requesting video removal, include the specific niksex URL(s)..." required></textarea>
        </div>

        <button type="submit" class="btn-pill" style="background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); border: none; padding: 12px 28px; font-size: 14px; cursor: pointer;">
          <i class="fa fa-paper-plane"></i> Submit Inquiry
        </button>
      </form>

      <div id="contactSuccessAlert" style="display: none; margin-top: 20px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981; padding: 14px; border-radius: 8px;">
        <i class="fa fa-check-circle"></i> Thank you! Your message has been received. Our team will review it within 24 hours.
      </div>
    </div>
  </div>

  <footer>
    <img src="/images/logo.png" alt="وقاية برو - Weqaya Pro" class="footer-logo">
    <p>&copy; 2026 وقاية برو (Weqaya Pro). All rights reserved.</p>
  </footer>

  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      document.getElementById('contactSuccessAlert').style.display = 'block';
      e.target.reset();
    }
  </script>
</body>
</html>
