<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Photography & Animated GIFs Gallery — Wi9ayah Pro</title>
  <meta name="description" content="Discover high-definition photos, animated GIFs, model editorial shots, and visual pinboards on Wi9ayah Pro.">
  <link rel="icon" type="image/png" href="/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/design-system.css?v=2.0">
  <link rel="stylesheet" href="/css/style.css?v=2.0">

  <!-- Monetization Scripts -->
  <script src="https://pl31054762.profitableratecpmnetwork.com/72/f4/9a/72f49a7889c2432c21f5fdf844a52e5d.js"></script>
</head>
<body>

  <div class="site-wrapper">
    <!-- Top Sticky Navigation Bar -->
    <header class="primary-nav">
      <div class="nav-container">
        <a href="/" class="brand-link">
          <div class="brand-p-badge">W</div>
          <span class="brand-text">Wi9ayah<span style="color: var(--color-ink);">.pro</span></span>
        </a>

        <div class="nav-search-wrapper">
          <i class="fa fa-search search-bar-icon"></i>
          <input type="text" id="photoSearchInput" class="search-bar" placeholder="Search photography, GIFs, aesthetics..." onkeydown="if(event.key==='Enter') filterPhotosByQuery(this.value)">
        </div>

        <div class="nav-actions-cluster desktop-only">
          <a href="/" class="nav-link-item">
            <i class="fa fa-compass"></i> Explore
          </a>
          <a href="/models.html" class="nav-link-item">
            <i class="fa fa-crown" style="color: #ffd700;"></i> Stars
          </a>
          <a href="/photos.html" class="nav-link-item active">
            <i class="fa fa-camera-retro"></i> Photos
          </a>
          <a href="/health.html" class="nav-link-item highlight-link">
            <i class="fa fa-shield-heart" style="color: #103c25;"></i> Health Guide
          </a>
          <a href="/favorites.html" class="btn-primary">
            <i class="fa fa-bookmark"></i> Saved Pins
          </a>
        </div>
      </div>
    </header>

    <!-- Filter Chips Row -->
    <nav class="filter-chips-row">
      <button class="filter-chip active" onclick="filterPhotoTab('all', this)"><i class="fa fa-th"></i> All Imagery</button>
      <button class="filter-chip" onclick="filterPhotoTab('gifs', this)"><i class="fa fa-play-circle"></i> Animated GIFs</button>
      <button class="filter-chip" onclick="filterPhotoTab('models', this)"><i class="fa fa-female"></i> Performer Sets</button>
      <button class="filter-chip" onclick="filterPhotoTab('art', this)"><i class="fa fa-paint-brush"></i> Sensual Art</button>
      <button class="filter-chip" onclick="filterPhotoTab('4k', this)"><i class="fa fa-expand"></i> Ultra HD 4K</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="masonry-container">

        <!-- True Multi-Column Photo Masonry Grid -->
        <div class="pin-masonry-grid" id="photosMasonryGrid"></div>

        <!-- Loading Indicator -->
        <div id="photosLoading" style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 48px 0; color: var(--color-mute); font-weight: 600;">
          <i class="fa fa-circle-notch fa-spin" style="font-size: 24px; color: var(--color-primary);"></i>
          <span>Loading photography pins...</span>
        </div>

      </div>
    </main>

    <!-- Photo Lightbox Modal (32px radius + 50% Scrim) -->
    <div class="modal-overlay" id="photoLightboxModal" onclick="closeLightbox(event)">
      <div class="modal-card" style="max-width: 800px; padding: 24px; text-align: center;">
        <button class="btn-icon-circular modal-close-btn" onclick="closeLightboxDirect()"><i class="fa fa-xmark"></i></button>
        <img src="" id="lightboxImage" style="width: 100%; max-height: 70vh; object-fit: contain; border-radius: var(--radius-md);" alt="Lightbox View">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px; flex-wrap: wrap; gap: 10px;">
          <h3 id="lightboxTitle" style="font-size: 16px; font-weight: 700; color: var(--color-ink);">Photo Pin</h3>
          <div style="display: flex; gap: 8px;">
            <button class="btn-primary" onclick="saveCurrentLightboxPin()"><i class="fa fa-bookmark"></i> Save Pin</button>
            <a href="" id="lightboxDownloadBtn" target="_blank" download class="btn-secondary"><i class="fa fa-download"></i> Download</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer-section">
      <div class="footer-container">
        <div class="footer-bottom-row" style="border: none; padding-top: 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="brand-p-badge" style="width: 24px; height: 24px; font-size: 12px;">W</div>
            <span style="font-weight: 700; color: var(--color-ink);">Wi9ayah Pro © 2026.</span>
          </div>
          <div>
            <a href="/" class="link-inline" style="margin-right: 16px;">Home</a>
            <a href="/health.html" class="link-inline" style="margin-right: 16px;">Health & Safety</a>
            <a href="/dmca.html" class="link-inline">DMCA</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-bar">
      <a href="/" class="mobile-tab-btn">
        <i class="fa fa-compass"></i>
        <span>Explore</span>
      </a>
      <a href="/reels.html" class="mobile-tab-btn">
        <i class="fa fa-clapperboard"></i>
        <span>Reels</span>
      </a>
      <a href="/models.html" class="mobile-tab-btn">
        <i class="fa fa-crown"></i>
        <span>Stars</span>
      </a>
      <a href="/photos.html" class="mobile-tab-btn active">
        <i class="fa fa-camera-retro"></i>
        <span>Photos</span>
      </a>
      <a href="/favorites.html" class="mobile-tab-btn">
        <i class="fa fa-bookmark"></i>
        <span>Saved</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="/js/masonry.js?v=2.0"></script>
  <script src="/js/photos.js?v=2.0"></script>
</body>
</html>
