  <script>
    let page4k = 1;
    let isLoading4k = false;
    let hasMore4k = true;
    let rendered4kIds = new Set();
    let observer4k = null;

    document.addEventListener('DOMContentLoaded', () => {
      load4kBatch(true);
      init4kInfiniteScroll();
    });

    async function load4kBatch(isInitial = false) {
      if (isLoading4k || (!hasMore4k && !isInitial)) return;
      isLoading4k = true;

      const grid = document.getElementById('grid4k');
      const loader = document.getElementById('loader4k');
      const countLabel = document.getElementById('countLabel4k');

      if (isInitial) {
        page4k = 1;
        hasMore4k = true;
        rendered4kIds.clear();
        grid.innerHTML = getSkeleton(8);
      } else if (loader) {
        loader.style.display = 'flex';
      }

      try {
        const res = await fetch(`/api/videos?category=4k&page=${page4k}`);
        const data = await res.json();
        const videos = (data.success && data.videos && data.videos.length > 0) ? data.videos : [];

        if (isInitial) grid.innerHTML = '';

        if (videos.length > 0) {
          const unique = videos.filter(v => !rendered4kIds.has(v.id));
          if (unique.length > 0) {
            unique.forEach(v => {
              rendered4kIds.add(v.id);
              grid.appendChild(create4kCard(v));
            });
            page4k++;
            if (countLabel) countLabel.innerText = `${rendered4kIds.size}+ 4K UHD Videos`;
          } else if (page4k > 1) {
            page4k++;
          }
        } else {
          hasMore4k = false;
        }
      } catch (e) {
        if (isInitial) grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 50px;">Failed to load 4K videos.</div>';
      } finally {
        isLoading4k = false;
        if (loader) loader.style.display = 'none';
      }
    }

    function create4kCard(v) {
      const card = document.createElement('div');
      card.className = 'video-card animate-fade';
      card.onclick = () => {
        const params = new URLSearchParams({
          id: v.id || '',
          title: v.title || '',
          embed: v.embed_url || v.video_url || '',
          thumb: v.thumbnail || '',
          duration: v.duration || '12:00',
          views: v.views || '22K',
          rating: v.rating || '99%',
          tags: (v.tags || ['4k', 'uhd', 'niksex']).join(',')
        });
        window.location.href = `/watch.html?${params.toString()}`;
      };

      card.innerHTML = `
        <div class="thumb-wrap">
          <img src="${v.thumbnail || '/images/logo.png'}" alt="${v.title}" loading="lazy" onerror="this.src='/images/logo.png'">
          <span class="badge-hd" style="background: linear-gradient(135deg, #00f2fe, #ff007f); color: #fff; font-weight: 800;">4K UHD</span>
          <span class="badge-duration">${v.duration || '12:00'}</span>
        </div>
        <div class="card-details">
          <h3 class="video-title" title="${v.title}">${v.title}</h3>
          <div class="video-meta">
            <span><i class="fa fa-eye"></i> ${v.views || '20K'}</span>
            <span class="meta-rating"><i class="fa fa-thumbs-up"></i> ${v.rating || '99%'}</span>
          </div>
        </div>
      `;
      return card;
    }

    function init4kInfiniteScroll() {
      const sentinel = document.getElementById('sentinel4k');
      if (!sentinel) return;
      observer4k = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoading4k && hasMore4k) {
          load4kBatch(false);
        }
      }, { rootMargin: '400px' });
      observer4k.observe(sentinel);
    }

    function handle4kSearch(e) {
      if (e.key === 'Enter') execute4kSearch();
    }
    function execute4kSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) window.location.href = `/?q=${encodeURIComponent(q)}`;
    }

    function getSkeleton(count = 8) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `
          <div class="video-card" style="opacity: 0.5;">
            <div class="thumb-wrap" style="background: #1e1e2d;"></div>
            <div class="card-details"><div style="height: 14px; background: #28283c; border-radius: 4px; margin-bottom: 8px;"></div></div>
          </div>
        `;
      }
      return html;
    }
  </script>
