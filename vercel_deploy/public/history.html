<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch History - niksex</title>
  <meta name="description" content="View your recently watched videos on niksex.">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=3.0">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <img src="/images/logo.png" alt="niksex Logo">
      </a>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search watch history..." oninput="filterHistory(event)">
        <button class="search-btn" aria-label="Search">
          <i class="fa fa-search"></i>
        </button>
      </div>

      <div class="nav-actions desktop-only">
        <a href="/models.html" class="btn-pill" style="background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 0, 127, 0.3)); border-color: #ffd700; color: #ffd700; font-weight: 800;">
          <i class="fa fa-star" style="color: #ffd700;"></i> Top Stars
        </a>
        <a href="/arabic.html" class="btn-pill btn-arabic">
          <i class="fa fa-star" style="color: #ffd700;"></i> Arabic Exclusives
        </a>
        <a href="/nikroli.html" class="btn-pill btn-tiktok" style="background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(255, 0, 127, 0.3)); border-color: #00f2fe; color: #fff;">
          <i class="fa-brands fa-tiktok" style="color: #00f2fe;"></i> nikroli (18+ Reels)
        </a>
        <a href="/categories.html" class="btn-pill">
          <i class="fa fa-th-large"></i> Categories
        </a>
        <a href="/favorites.html" class="btn-pill">
          <i class="fa fa-heart" style="color: #ff007f;"></i> Favorites
        </a>
        <a href="/" class="btn-pill">
          <i class="fa fa-home"></i> Home
        </a>
      </div>
    </div>
  </header>

  <!-- History Main Container -->
  <main class="main-container" style="margin-top: 20px;">

    <div class="section-header">
      <h1 class="section-title" style="font-size: 20px;">
        <i class="fa fa-history" style="color: var(--accent-pink);"></i>
        <span>My Watch History</span>
      </h1>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="text-muted" id="histCountLabel" style="font-size: 13px;">Loading history...</span>
        <button id="btnClearHist" class="btn-pill" style="padding: 4px 10px; font-size: 11px; border-color: #ef4444; color: #ef4444;" onclick="clearAllHistory()">
          <i class="fa fa-trash"></i> Clear History
        </button>
      </div>
    </div>

    <!-- Videos Grid -->
    <div class="videos-grid" id="historyGrid"></div>

  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="/models.html" class="bottom-nav-item" style="color: #ffd700;">
      <i class="fa fa-star"></i>
      <span>Stars</span>
    </a>
    <a href="/arabic.html" class="bottom-nav-item" style="color: #ffd700;">
      <i class="fa fa-globe"></i>
      <span>Arabic</span>
    </a>
    <a href="/nikroli.html" class="bottom-nav-item" style="color: #00f2fe;">
      <i class="fa-brands fa-tiktok"></i>
      <span>nikroli</span>
    </a>
    <a href="/photos.html" class="bottom-nav-item" style="color: var(--accent-pink);">
      <i class="fa fa-images"></i>
      <span>Photos</span>
    </a>
    <a href="/" class="bottom-nav-item">
      <i class="fa fa-home"></i>
      <span>Home</span>
    </a>
    <a href="/history.html" class="bottom-nav-item active">
      <i class="fa fa-history"></i>
      <span>History</span>
    </a>
  </nav>

  <!-- Footer -->
  <footer>
    <img src="/images/logo.png" alt="niksex" class="footer-logo">
    <p style="margin-top: 15px; color: var(--text-muted);">&copy; 2026 niksex. All rights reserved.</p>
  </footer>

  <script>
    let localHistory = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadHistoryPage();
    });

    function loadHistoryPage() {
      try {
        localHistory = JSON.parse(localStorage.getItem('niksex_watch_history') || '[]');
      } catch (e) {
        localHistory = [];
      }
      renderHistory(localHistory);
    }

    function renderHistory(list) {
      const grid = document.getElementById('historyGrid');
      const countLabel = document.getElementById('histCountLabel');
      const clearBtn = document.getElementById('btnClearHist');

      if (!list || list.length === 0) {
        if (countLabel) countLabel.innerText = '0 Watched Videos';
        if (clearBtn) clearBtn.style.display = 'none';
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted);">
            <i class="fa fa-history fa-3x" style="color: var(--accent-pink); margin-bottom: 14px; opacity: 0.6;"></i>
            <h3 style="color: #fff; margin-bottom: 6px;">Your Watch History is Empty</h3>
            <p style="font-size: 13px;">Videos you watch will be automatically saved here in your browser for quick access!</p>
            <a href="/" class="btn-pill" style="margin-top: 15px; display: inline-flex;">Explore Trending Videos</a>
          </div>
        `;
        return;
      }

      if (countLabel) countLabel.innerText = `${list.length} Saved in History`;
      if (clearBtn) clearBtn.style.display = 'inline-flex';
      grid.innerHTML = '';

      list.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card animate-fade';
        card.onclick = () => {
          const params = new URLSearchParams({
            id: v.id || '',
            title: v.title || '',
            embed: v.embed_url || v.video_url || '',
            thumb: v.thumbnail || '',
            duration: v.duration || '12:00',
            views: v.views || '18K',
            rating: v.rating || '98%',
            tags: (v.tags || ['history', 'niksex']).join(',')
          });
          window.location.href = `/watch.html?${params.toString()}`;
        };

        card.innerHTML = `
          <div class="thumb-wrap">
            <img src="${v.thumbnail || '/images/logo.png'}" alt="${v.title}" loading="lazy" onerror="this.src='/images/logo.png'">
            <span class="badge-watched"><i class="fa fa-check"></i> Watched</span>
            <span class="badge-duration">${v.duration || '12:00'}</span>
          </div>
          <div class="card-details">
            <h3 class="video-title" title="${v.title}">${v.title}</h3>
            <div class="video-meta">
              <span><i class="fa fa-eye"></i> ${v.views || '15K'}</span>
              <span class="meta-rating"><i class="fa fa-thumbs-up"></i> ${v.rating || '98%'}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterHistory(e) {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderHistory(localHistory);
        return;
      }
      const filtered = localHistory.filter(v => 
        (v.title && v.title.toLowerCase().includes(term)) ||
        (v.tags && v.tags.some(t => t.toLowerCase().includes(term)))
      );
      renderHistory(filtered);
    }

    function clearAllHistory() {
      if (confirm('Are you sure you want to clear your saved watch history?')) {
        localStorage.removeItem('niksex_watch_history');
        localStorage.removeItem('niksex_interest_scores');
        localHistory = [];
        renderHistory([]);
      }
    }
  </script>
</body>
</html>
